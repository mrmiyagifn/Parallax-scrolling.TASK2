<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: #222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .card p {
            padding: 15px;
            margin: 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Porsche Collection</h1>

    <div class="gallery">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?q=80&w=800&auto=format&fit=crop" alt="Porsche 911">
            <p>Porsche 911 GT3</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=800&auto=format&fit=crop" alt="Porsche Taycan">
            <p>Porsche Taycan</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1611821064430-0d40291d0f0d?q=80&w=800&auto=format&fit=crop" alt="Classic Porsche">
            <p>Classic Porsche 911</p>
        </div>
    </div>

</body>
</html>
